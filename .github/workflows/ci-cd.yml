# CI/CD for @sudobility/characterbuilder_client — publishes to npm (restricted access) on push to main
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  id-token: write
  deployments: write
  packages: write

jobs:
  cicd:
    uses: johnqh/workflows/.github/workflows/unified-cicd.yml@main
    secrets: inherit
    with:
      publish-target: github
